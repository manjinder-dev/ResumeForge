services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeforge-backend
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5000:8080"
    networks:
      - resume-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumeforge-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - resume-network
    restart: unless-stopped

networks:
  resume-network:
    name: resume-network
    driver: bridge
